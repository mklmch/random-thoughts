{{ define "main" }}
<article class="post-single">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="post-content">{{ . }}</div>{{ end }}
  </header>

  <div class="bubble-stream">
    {{ range .Pages.ByDate.Reverse }}
      <a class="bubble-entry" href="{{ .RelPermalink }}">
        <span class="bubble-entry-date">{{ .Date.Format "January 2, 2006" }}</span>
        <h3 class="bubble-entry-title">{{ .Title }}</h3>
        <p class="bubble-entry-summary">{{ .Summary }}</p>
      </a>
    {{ end }}
  </div>
</article>
{{ end }}
