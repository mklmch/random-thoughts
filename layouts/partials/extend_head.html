{{- /* ?v= changes on every build, so browsers fetch the new file right after a deploy */ -}}
<link rel="stylesheet" href="{{ "css/custom.css" | relURL }}?v={{ now.Unix }}">

{{ if .Params.math }}
<link rel="stylesheet" href="{{ "katex/katex.min.css" | relURL }}">
<script defer src="{{ "katex/katex.min.js" | relURL }}"></script>
<script defer src="{{ "katex/contrib/auto-render.min.js" | relURL }}"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError: false
    });"></script>
{{ end }}
